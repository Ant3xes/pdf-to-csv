<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertisseur de factures</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Convertisseur de factures</h1>

    <section id="drop-zone" aria-label="Zone de dépôt des factures">
      <p>Glissez-déposez vos factures (PDF, JPG, PNG, HEIC) ici, ou</p>
      <label>
        choisir des fichiers
        <input id="file-input" type="file" accept=".pdf,.PDF,.jpg,.jpeg,.png,.heic,.JPG,.JPEG,.PNG,.HEIC,application/pdf,image/jpeg,image/png,image/heic" multiple hidden>
      </label>
    </section>

    <p id="processing-indicator" hidden aria-live="polite">Traitement en cours…</p>
    <p id="error-message" hidden role="alert"></p>

    <p class="export-actions">
      <button type="button" id="export-csv" disabled>Exporter CSV</button>
    </p>

    <section id="factures-section" class="results-section" aria-labelledby="factures-heading">
      <h2 id="factures-heading">Factures (<span id="factures-count">0</span>)</h2>
      <table id="factures-table" class="results-table">
        <thead>
          <tr>
            <th>Fichier</th>
            <th>Émetteur</th>
            <th>Date</th>
            <th>Montant HT</th>
            <th>Statut</th>
            <th>Type</th>
            <th>Action</th>
            <th>Aperçu</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="avoirs-section" class="results-section" aria-labelledby="avoirs-heading">
      <h2 id="avoirs-heading">Avoirs (<span id="avoirs-count">0</span>)</h2>
      <table id="avoirs-table" class="results-table">
        <thead>
          <tr>
            <th>Fichier</th>
            <th>Émetteur</th>
            <th>Date</th>
            <th>Montant HT</th>
            <th>Statut</th>
            <th>Type</th>
            <th>Action</th>
            <th>Aperçu</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
