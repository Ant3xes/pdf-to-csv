<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertisseur de factures</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Convertisseur de factures</h1>

    <section id="drop-zone" aria-label="Zone de dépôt des factures">
      <p>Glissez-déposez vos factures (PDF, JPG, PNG, HEIC) ici, ou</p>
      <label>
        choisir des fichiers
        <input id="file-input" type="file" accept=".pdf,.PDF,.jpg,.jpeg,.png,.heic,.JPG,.JPEG,.PNG,.HEIC,application/pdf,image/jpeg,image/png,image/heic" multiple hidden>
      </label>
    </section>

    <p id="processing-indicator" hidden aria-live="polite">Traitement en cours…</p>
    <p id="error-message" hidden role="alert"></p>

    <p id="export-block-message" class="export-block-message" hidden role="status"></p>

    <p class="export-actions">
      <button type="button" id="export-csv" disabled>Exporter CSV</button>
    </p>

    <section id="documents-section" class="results-section" aria-labelledby="documents-heading">
      <h2 id="documents-heading">
        Documents
        (<span id="factures-count">0</span> factures, <span id="avoirs-count">0</span> avoirs)
      </h2>
      <div id="issuer-groups" class="issuer-groups"></div>
    </section>

    <section id="totaux-emetteurs" class="totaux-emetteurs" hidden aria-labelledby="totaux-emetteurs-heading">
      <div class="totaux-emetteurs-header">
        <h2 id="totaux-emetteurs-heading">Synthèse par émetteur</h2>
        <p class="totaux-emetteurs-subtitle">Totaux nets HT du lot en cours</p>
      </div>
      <ul id="totaux-emetteurs-list" class="totaux-emetteurs-list"></ul>
    </section>
  </main>
  <script src="{{ url_for('static', filename='lot_grouping.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
