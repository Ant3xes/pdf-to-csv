  amount: 'TOTAL HT TVA (?:A PAYER TTC|CREDIT)[\s\S]*?(-?\d{1,3}(?:[ .\u00a0]\d{3})*,\d{2})\s*€\s+-?\d{1,3}(?:[ .\u00a0]\d{3})*,\d{2}\s*€\s+-?\d{1,3}(?:[ .\u00a0]\d{3})*,\d{2}'
options:
  date_formats:
    - '%d/%m/%y'
  decimal_separator: ','
